<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Teleboxel client</title>
        <style>
            body {
                display: flex;
                height: 100vh;
                margin: 0;
                font-family: system-ui;
                background: #1e1e1e;
                color: #e0e0e0;
            }
            canvas {
                display: block;
                flex: 1;
                min-width: 0;
                height: 100vh;
                cursor: crosshair;
            }
            aside {
                display: flex;
                flex-direction: column;
                gap: 12px;
                width: 360px;
                padding: 12px;
                box-sizing: border-box;
            }
            input,
            button {
                padding: 4px 8px;
                font: inherit;
                background: #2d2d2d;
                color: #e0e0e0;
                border: 1px solid #555;
                border-radius: 4px;
            }
            #connection {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
            }
            #url {
                flex: 1 0 100%;
                box-sizing: border-box;
            }
            input[type="number"] {
                width: 40px;
            }
            #connect {
                margin-left: auto;
            }
            #palette {
                display: grid;
                grid-template-columns: repeat(15, 1fr);
                gap: 4px;
            }
            #palette button {
                aspect-ratio: 1;
                padding: 0;
                border: none;
            }
            #palette .active {
                outline: 2px solid #fff;
                outline-offset: 1px;
            }
            #hud,
            #help,
            #log {
                margin: 0;
                font-family: monospace;
                white-space: pre-wrap;
            }
            #help {
                color: #999;
            }
            #log {
                flex: 1;
                overflow-y: auto;
                padding: 8px;
                border: 1px solid #444;
                background: #252525;
            }
        </style>
    </head>
    <body>
        <canvas id="world"></canvas>
        <aside>
            <div id="connection">
                <input id="url" value="ws://127.0.0.1:3000" />
                <label>view_xz <input id="viewXZ" type="number" value="2" min="0" max="255" /></label>
                <label>view_y <input id="viewY" type="number" value="1" min="0" max="255" /></label>
                <button id="connect">Connect</button>
            </div>
            <div id="palette"></div>
            <pre id="hud"></pre>
            <pre id="help">
WASD       → move
Q / E      → layer down / up
drag       → paint
right drag → erase
wheel      → zoom
1–9        → color
shaded     → chunks received</pre>
            <div id="log"></div>
        </aside>

        <script>
            // Wire format: PROTOCOL.md. Little-endian, no per-message length.
            const PROTOCOL_VERSION = 1;
            const SPEED = 16; // voxels per second
            const POS_LIMIT = 2 ** 23; // entity range in voxels (24.8 fixed point)
            // Block id -> color; 0 is air. Ids outside the palette (e.g. the bots') are grey.
            const PALETTE = [
                null,
                "#e6194b",
                "#f58231",
                "#ffe119",
                "#bfef45",
                "#3cb44b",
                "#42d4f4",
                "#4363d8",
                "#911eb4",
                "#f032e6",
                "#fabed4",
                "#9a6324",
                "#808000",
                "#469990",
                "#dcbeff",
                "#ffffff",
            ];
            const OTHER_BLOCK = "#666";

            const $ = (id) => document.getElementById(id);
            const canvas = $("world");
            const ctx = canvas.getContext("2d");

            let ws = null;
            let state = null; // per connection
            let ticker = null; // set from WELCOME until the connection ends

            // Our entity, and the layer we look at. The entity stands on that layer.
            const me = { x: 8, z: 8 };
            let layer = 0;
            let px = 8; // CSS pixels per voxel: a power of 2 in [2, 32]
            let active = 1; // block painted with the left button
            const keys = new Set(); // WASD held
            let mouse = null; // cursor position on the canvas
            let stroke = null; // { block, last: [x, z] } while a button is held

            function newState(view) {
                return {
                    view, // [view_xz, view_y] sent in HELLO
                    id: null,
                    hz: null,
                    tick: null,
                    entities: new Map(), // id -> { pos: [x, y, z] (24.8), data: Uint8Array }
                    chunks: new Map(), // "cx,cy,cz" -> Uint16Array(4096), index x | z << 4 | y << 8
                    edits: new Map(), // "x,y,z" -> [x, y, z, block], sent at the next tick
                    sendState: true, // our ENTITY_STATE is due at the next tick
                    rateSince: performance.now(),
                    rateBytes: 0,
                    kibps: 0,
                };
            }

            const chunkKey = (x, y, z) => `${x >> 4},${y >> 4},${z >> 4}`;
            const voxelIndex = (x, y, z) => (x & 15) | ((z & 15) << 4) | ((y & 15) << 8);
            const clampPos = (v) => Math.min(Math.max(v, -POS_LIMIT), POS_LIMIT - 1);
            const fixedPoint = (v) => Math.round(v * 256); // 24.8 fixed point, as sent

            function log(text) {
                $("log").textContent += `[${new Date().toLocaleTimeString()}] ${text}\n`;
                $("log").scrollTop = $("log").scrollHeight;
            }

            /** Reads an integer input, failing loudly instead of wrapping. */
            function intInput(id, min, max) {
                const value = $(id).valueAsNumber; // NaN when empty or invalid
                if (!Number.isInteger(value) || value < min || value > max) {
                    throw new Error(`${id} must be an integer in [${min}, ${max}]`);
                }
                return value;
            }

            function send(bytes) {
                if (ws?.readyState !== WebSocket.OPEN) throw new Error("not connected");
                ws.send(bytes);
            }

            // Client → server. Positions stay inside POS_LIMIT (clampPos),
            // so no value below can wrap.

            function hello([viewXZ, viewY]) {
                const buf = new DataView(new ArrayBuffer(5));
                buf.setUint8(0, 0x01);
                buf.setUint16(1, PROTOCOL_VERSION, true);
                buf.setUint8(3, viewXZ);
                buf.setUint8(4, viewY);
                return buf.buffer;
            }

            function entityState() {
                const buf = new DataView(new ArrayBuffer(14));
                buf.setUint8(0, 0x02);
                [me.x, layer, me.z].forEach((v, i) => buf.setInt32(1 + 4 * i, fixedPoint(v), true));
                buf.setUint8(13, 0); // no data
                return buf.buffer;
            }

            function voxelEdits(edits) {
                if (edits.length > 0xffff) throw new Error(`${edits.length} edits in one tick`);
                const buf = new DataView(new ArrayBuffer(3 + 14 * edits.length));
                buf.setUint8(0, 0x03);
                buf.setUint16(1, edits.length, true);
                edits.forEach(([x, y, z, block], i) => {
                    const o = 3 + 14 * i;
                    buf.setInt32(o, x, true);
                    buf.setInt32(o + 4, y, true);
                    buf.setInt32(o + 8, z, true);
                    buf.setUint16(o + 12, block, true);
                });
                return buf.buffer;
            }

            // Server → client. Throws on anything unexpected.

            function applyFrame(buffer) {
                const view = new DataView(buffer);
                let o = 0;
                // Returns the current offset and advances past `size` bytes.
                // Reading past the end throws a RangeError (truncated frame).
                const take = (size) => (o += size) - size;
                const u8 = () => view.getUint8(take(1));
                const u16 = () => view.getUint16(take(2), true);
                const u32 = () => view.getUint32(take(4), true);
                const i32 = () => view.getInt32(take(4), true);
                const pos = () => [i32(), i32(), i32()];
                const chunk = (key) => {
                    const blocks = state.chunks.get(key);
                    if (!blocks) throw new Error(`chunk ${key} is not known`);
                    return blocks;
                };

                state.tick = u32();
                while (o < buffer.byteLength) {
                    const type = u8();
                    switch (type) {
                        case 0x81: // WELCOME
                            if (state.id !== null) throw new Error("second WELCOME");
                            state.id = u32();
                            state.hz = u8();
                            log(`WELCOME: entity ${state.id}, ${state.hz} Hz`);
                            ticker = setInterval(() => run(tick), 1000 / state.hz);
                            break;
                        case 0x82: {
                            // ENTITY_STATE
                            const id = u32();
                            const p = pos();
                            const len = u8();
                            if (o + len > buffer.byteLength) throw new Error("truncated ENTITY_STATE");
                            state.entities.set(id, { pos: p, data: new Uint8Array(buffer, o, len) });
                            o += len;
                            break;
                        }
                        case 0x83: {
                            // ENTITY_REMOVE
                            const id = u32();
                            if (!state.entities.delete(id)) throw new Error(`entity ${id} is not known`);
                            break;
                        }
                        case 0x84: {
                            // CHUNK
                            const key = pos().join(",");
                            const blocks = new Uint16Array(4096);
                            for (let i = 0; i < 4096; i++) blocks[i] = u16();
                            state.chunks.set(key, blocks);
                            break;
                        }
                        case 0x85: {
                            // CHUNK_EDITS
                            const blocks = chunk(pos().join(","));
                            for (let n = u16(); n > 0; n--) {
                                const index = u16();
                                // Typed arrays ignore out-of-range writes silently.
                                if (index >= blocks.length) throw new Error(`chunk index ${index} out of range`);
                                blocks[index] = u16();
                            }
                            break;
                        }
                        case 0x86: {
                            // CHUNK_UNLOAD
                            const key = pos().join(",");
                            chunk(key);
                            state.chunks.delete(key);
                            break;
                        }
                        default:
                            throw new Error(`unknown message type 0x${type.toString(16)}`);
                    }
                }
            }

            function onMessage(event) {
                try {
                    if (typeof event.data === "string") throw new Error("text message");
                    state.rateBytes += event.data.byteLength;
                    applyFrame(event.data);
                } catch (e) {
                    // Without per-message lengths the rest of the stream cannot be trusted.
                    log(`protocol error: ${e.message}; disconnecting`);
                    stopTicking();
                    ws.onmessage = null;
                    ws.close();
                }
            }

            // Tick: movement and edits go out once per server tick.

            function tick() {
                const dx = keys.has("d") - keys.has("a");
                const dz = keys.has("s") - keys.has("w");
                if (dx || dz) {
                    me.x = clampPos(me.x + (dx * SPEED) / state.hz);
                    me.z = clampPos(me.z + (dz * SPEED) / state.hz);
                    state.sendState = true;
                }
                // Moving drags the world under a still cursor.
                if (stroke && mouse) strokeTo(cursorVoxel());
                if (state.sendState) {
                    send(entityState());
                    state.sendState = false;
                }
                if (state.edits.size > 0) {
                    send(voxelEdits([...state.edits.values()]));
                    state.edits.clear();
                }
            }

            function stopTicking() {
                clearInterval(ticker);
                ticker = null;
                stroke = null;
            }

            // Painting

            /** Canvas position of voxel (0, 0), so the camera follows our entity. */
            function origin() {
                return [
                    Math.round(canvas.clientWidth / 2 - me.x * px),
                    Math.round(canvas.clientHeight / 2 - me.z * px),
                ];
            }

            function cursorVoxel() {
                const [ox, oz] = origin();
                return [Math.floor((mouse.x - ox) / px), Math.floor((mouse.y - oz) / px)];
            }

            function strokeTo([x, z]) {
                if (!stroke.last) {
                    edit(x, z);
                } else {
                    // Mouse events skip cells on a fast drag: fill the line between them.
                    const [lx, lz] = stroke.last;
                    const steps = Math.max(Math.abs(x - lx), Math.abs(z - lz));
                    for (let i = 1; i <= steps; i++) {
                        edit(lx + Math.round(((x - lx) * i) / steps), lz + Math.round(((z - lz) * i) / steps));
                    }
                }
                stroke.last = [x, z];
            }

            function edit(x, z) {
                const y = layer;
                // Only sent, never applied here: this is a debug client, so it draws
                // only what the server sent, and our edits show up when their
                // echo (CHUNK or CHUNK_EDITS) arrives.
                state.edits.set(`${x},${y},${z}`, [x, y, z, stroke.block]);
            }

            // Drawing: everything visible, every animation frame.

            function draw() {
                requestAnimationFrame(draw);
                const w = canvas.clientWidth;
                const h = canvas.clientHeight;
                // Sized in device pixels, drawn in CSS pixels: sharp on HiDPI screens.
                const dpr = window.devicePixelRatio;
                if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
                    canvas.width = Math.round(w * dpr);
                    canvas.height = Math.round(h * dpr);
                }
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const [ox, oz] = origin();
                const chunkPx = 16 * px;
                // Visible chunk columns and rows.
                const cx0 = Math.floor(-ox / chunkPx);
                const cx1 = Math.floor((w - ox) / chunkPx);
                const cz0 = Math.floor(-oz / chunkPx);
                const cz1 = Math.floor((h - oz) / chunkPx);

                ctx.fillStyle = "#111";
                ctx.fillRect(0, 0, w, h);

                // Chunks we have, and their voxels on this layer.
                for (let cz = cz0; cz <= cz1; cz++) {
                    for (let cx = cx0; cx <= cx1; cx++) {
                        const blocks = state?.chunks.get(`${cx},${layer >> 4},${cz}`);
                        if (!blocks) continue;
                        const sx = ox + cx * chunkPx;
                        const sz = oz + cz * chunkPx;
                        ctx.fillStyle = "#1f2c3c";
                        ctx.fillRect(sx, sz, chunkPx, chunkPx);
                        const base = (layer & 15) << 8;
                        for (let i = 0; i < 256; i++) {
                            const block = blocks[base | i];
                            if (block === 0) continue;
                            ctx.fillStyle = PALETTE[block] ?? OTHER_BLOCK;
                            ctx.fillRect(sx + (i & 15) * px, sz + (i >> 4) * px, px, px);
                        }
                    }
                }

                // Chunk grid.
                ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let cx = cx0; cx <= cx1 + 1; cx++) {
                    ctx.moveTo(ox + cx * chunkPx + 0.5, 0);
                    ctx.lineTo(ox + cx * chunkPx + 0.5, h);
                }
                for (let cz = cz0; cz <= cz1 + 1; cz++) {
                    ctx.moveTo(0, oz + cz * chunkPx + 0.5);
                    ctx.lineTo(w, oz + cz * chunkPx + 0.5);
                }
                ctx.stroke();

                if (state) {
                    // View and hysteresis boxes around our center chunk.
                    // From the position as sent, so the boxes match the server's.
                    const cx = fixedPoint(me.x) >> 12;
                    const cz = fixedPoint(me.z) >> 12;
                    ctx.font = "12px monospace";
                    const box = (r, color, label) => {
                        const x = ox + (cx - r) * chunkPx;
                        const z = oz + (cz - r) * chunkPx;
                        const size = (2 * r + 1) * chunkPx;
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x, z, size, size);
                        ctx.fillStyle = color;
                        ctx.fillText(label, x + 4, z + 14);
                    };
                    box(state.view[0], "#4c4", "view");
                    box(state.view[0] + 1, "#e83", "view+1");

                    // Other entities, where the server last put them.
                    for (const [id, entity] of state.entities) {
                        const x = ox + (entity.pos[0] / 256) * px;
                        const z = oz + (entity.pos[2] / 256) * px;
                        dot(x, z, 4, "#fd4");
                        ctx.fillText(id, x + 6, z - 6);
                    }
                }
                dot(w / 2, h / 2, 6, "#fff");
                if (state?.id != null) ctx.fillText(state.id, w / 2 + 8, h / 2 - 8);

                let under = "-";
                if (mouse) {
                    const [x, z] = cursorVoxel();
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(ox + x * px + 0.5, oz + z * px + 0.5, px - 1, px - 1);
                    const blocks = state?.chunks.get(chunkKey(x, layer, z));
                    under = `${x}, ${layer}, ${z}: ${blocks ? `block ${blocks[voxelIndex(x, layer, z)]}` : "chunk not known"}`;
                }
                showHud(under);
            }

            function dot(x, z, radius, color) {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, z, radius, 0, 2 * Math.PI);
                ctx.fill();
            }

            function showHud(under) {
                if (state) {
                    const now = performance.now();
                    if (now - state.rateSince >= 1000) {
                        state.kibps = state.rateBytes / 1024 / ((now - state.rateSince) / 1000);
                        state.rateSince = now;
                        state.rateBytes = 0;
                    }
                }
                $("hud").textContent =
                    `id ${state?.id ?? "-"} | tick ${state?.tick ?? "-"}\n` +
                    `entities ${state?.entities.size ?? 0} | chunks ${state?.chunks.size ?? 0}` +
                    ` | ${(state?.kibps ?? 0).toFixed(1)} KiB/s\n` +
                    `position ${me.x.toFixed(1)}, ${layer}, ${me.z.toFixed(1)}\n` +
                    `cursor ${under}`;
            }

            // UI

            function run(action) {
                try {
                    action();
                } catch (e) {
                    log(`error: ${e.message}`);
                }
            }

            function selectBlock(block) {
                active = block;
                [...$("palette").children].forEach((swatch, i) => swatch.classList.toggle("active", i + 1 === block));
            }

            for (let block = 1; block < PALETTE.length; block++) {
                const swatch = document.createElement("button");
                swatch.style.background = PALETTE[block];
                swatch.title = `block ${block}`;
                swatch.onclick = () => selectBlock(block);
                $("palette").append(swatch);
            }
            selectBlock(active);

            function connect() {
                const view = [intInput("viewXZ", 0, 255), intInput("viewY", 0, 255)];
                ws = new WebSocket($("url").value);
                $("connect").textContent = "Disconnect";
                state = newState(view);
                ws.binaryType = "arraybuffer";
                ws.onopen = () => {
                    log("connected, sending HELLO");
                    ws.send(hello(view));
                };
                ws.onmessage = onMessage;
                ws.onclose = (e) => {
                    log(`closed: code ${e.code}${e.reason ? `, reason "${e.reason}"` : ""}`);
                    stopTicking();
                    ws = null;
                    state = null;
                    $("connect").textContent = "Connect";
                };
                ws.onerror = () => log("WebSocket error (see the close code)");
            }

            function disconnect() {
                stopTicking();
                ws.close(1000);
            }

            $("connect").onclick = () => run(ws ? disconnect : connect);

            canvas.onmousedown = (e) => {
                if (e.button !== 0 && e.button !== 2) return;
                if (!ticker) return log("error: not connected");
                mouse = { x: e.offsetX, y: e.offsetY };
                stroke = { block: e.button === 0 ? active : 0, last: null };
                strokeTo(cursorVoxel());
            };
            canvas.onmousemove = (e) => {
                mouse = { x: e.offsetX, y: e.offsetY };
                if (stroke) strokeTo(cursorVoxel());
            };
            canvas.onmouseleave = () => {
                mouse = null;
                stroke = null;
            };
            window.onmouseup = () => (stroke = null);
            canvas.oncontextmenu = (e) => e.preventDefault();
            // Zooms about the center, where the camera keeps our entity.
            canvas.onwheel = (e) => {
                e.preventDefault();
                if (e.deltaY < 0) px = Math.min(px * 2, 32);
                if (e.deltaY > 0) px = Math.max(px / 2, 2);
            };

            window.onkeydown = (e) => {
                if (e.target instanceof HTMLInputElement) return;
                const key = e.key.toLowerCase();
                if (["w", "a", "s", "d"].includes(key)) keys.add(key);
                if (/^[1-9]$/.test(key)) selectBlock(Number(key));
                if (key === "q" || key === "e") {
                    layer = clampPos(layer + (key === "e" ? 1 : -1));
                    if (state) state.sendState = true;
                }
            };
            window.onkeyup = (e) => keys.delete(e.key.toLowerCase());
            // A key or button released outside the page would otherwise keep us
            // moving or painting.
            window.onblur = () => {
                keys.clear();
                stroke = null;
            };

            draw();
        </script>
    </body>
</html>
